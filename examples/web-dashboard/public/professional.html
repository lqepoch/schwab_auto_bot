<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 专业股票交易仪表板 - Schwab API</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #ffffff;
            overflow-x: hidden;
            font-size: 14px;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
            border-bottom: 1px solid #333;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #64b5f6;
        }
        
        .market-status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr 280px;
            grid-template-rows: 1fr;
            height: calc(100vh - 70px);
            gap: 1px;
            background: #333;
        }
        
        .left-panel {
            background: #1a1a1a;
            border-right: 1px solid #333;
            overflow-y: auto;
        }
        
        .center-panel {
            background: #1a1a1a;
            display: grid;
            grid-template-rows: 400px 1fr;
            gap: 1px;
        }
        
        .right-panel {
            background: #1a1a1a;
            border-left: 1px solid #333;
            overflow-y: auto;
        }
        
        .panel-header {
            background: #2a2a2a;
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            font-weight: 600;
            color: #64b5f6;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-content {
            padding: 15px;
        }
        
        /* 股票列表样式 */
        .stock-list {
            padding: 0;
        }
        
        .stock-item {
            padding: 12px 15px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        
        .stock-item:hover {
            background: #2a2a2a;
        }
        
        .stock-item.active {
            background: rgba(100, 181, 246, 0.1);
            border-left: 3px solid #64b5f6;
        }
        
        .stock-symbol {
            font-weight: bold;
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .stock-price {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        .stock-change {
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .stock-volume {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
        
        /* Level II 买卖盘样式 */
        .level2-container {
            padding: 0;
        }
        
        .level2-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            padding: 10px 15px;
            background: #2a2a2a;
            font-size: 0.8rem;
            font-weight: 600;
            color: #888;
            border-bottom: 1px solid #333;
        }
        
        .level2-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 300px;
        }
        
        .bid-side, .ask-side {
            overflow-y: auto;
        }
        
        .bid-side {
            border-right: 1px solid #333;
        }
        
        .level2-row {
            display: grid;
            grid-template-columns: 60px 1fr 60px;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-bottom: 1px solid #2a2a2a;
            align-items: center;
        }
        
        .level2-row:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .bid-row {
            background: rgba(76, 175, 80, 0.05);
        }
        
        .ask-row {
            background: rgba(244, 67, 54, 0.05);
        }
        
        .level2-price {
            font-weight: 600;
            text-align: right;
        }
        
        .level2-size {
            text-align: center;
            color: #888;
        }
        
        .level2-count {
            text-align: center;
            font-size: 0.7rem;
            color: #666;
        }
        
        /* K线图容器 */
        .chart-container {
            background: #1a1a1a;
            position: relative;
        }
        
        .chart-toolbar {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }
        
        .chart-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .chart-btn:hover {
            background: rgba(100, 181, 246, 0.2);
            border-color: #64b5f6;
        }
        
        .chart-btn.active {
            background: #64b5f6;
            color: #fff;
        }
        
        /* 技术指标面板 */
        .indicators-panel {
            background: #2a2a2a;
            border-top: 1px solid #333;
            padding: 15px;
        }
        
        .indicator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .indicator-name {
            font-weight: 500;
            color: #ccc;
        }
        
        .indicator-value {
            font-weight: bold;
            color: #64b5f6;
        }
        
        /* 交易信息面板 */
        .trade-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #64b5f6;
        }
        
        .info-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        
        /* 颜色定义 */
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .neutral { color: #94a3b8; }
        
        .bid-color { color: #4ade80; }
        .ask-color { color: #f87171; }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 250px 1fr 250px;
            }
        }
        
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            
            .left-panel, .right-panel {
                height: 300px;
            }
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            color: #64b5f6;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top: 2px solid #64b5f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                专业股票交易终端
            </div>
            <div class="market-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">连接中...</span>
            </div>
        </div>
        <div class="header-right">
            <div>数据更新: <span id="dataCount">0</span></div>
            <div>运行时间: <span id="uptime">0s</span></div>
            <div>延迟: <span id="latency">--ms</span></div>
        </div>
    </div>
    
    <div class="main-container">
        <!-- 左侧面板 - 股票列表 -->
        <div class="left-panel">
            <div class="panel-header">
                <i class="fas fa-list"></i>
                股票列表
            </div>
            <div class="stock-list" id="stockList">
                <div class="loading">
                    <div class="spinner"></div>
                    加载股票数据...
                </div>
            </div>
        </div>
        
        <!-- 中央面板 - K线图 -->
        <div class="center-panel">
            <div class="chart-container">
                <div class="chart-toolbar">
                    <button class="chart-btn active" data-period="1m">1分钟</button>
                    <button class="chart-btn" data-period="5m">5分钟</button>
                    <button class="chart-btn" data-period="15m">15分钟</button>
                    <button class="chart-btn" data-period="1h">1小时</button>
                    <button class="chart-btn" data-period="1d">日线</button>
                </div>
                <div id="candlestickChart" style="width: 100%; height: 100%;"></div>
            </div>
            
            <!-- 技术指标面板 -->
            <div class="indicators-panel">
                <div class="panel-header">
                    <i class="fas fa-chart-bar"></i>
                    技术指标
                </div>
                <div id="indicatorsList">
                    <div class="indicator-item">
                        <span class="indicator-name">RSI (14)</span>
                        <span class="indicator-value" id="rsiValue">--</span>
                    </div>
                    <div class="indicator-item">
                        <span class="indicator-name">MACD</span>
                        <span class="indicator-value" id="macdValue">--</span>
                    </div>
                    <div class="indicator-item">
                        <span class="indicator-name">成交量</span>
                        <span class="indicator-value" id="volumeValue">--</span>
                    </div>
                    <div class="indicator-item">
                        <span class="indicator-name">换手率</span>
                        <span class="indicator-value" id="turnoverValue">--</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 右侧面板 - Level II 和交易信息 -->
        <div class="right-panel">
            <!-- 当前股票信息 -->
            <div class="panel-header">
                <i class="fas fa-info-circle"></i>
                <span id="currentSymbol">选择股票</span>
            </div>
            <div class="panel-content">
                <div class="trade-info" id="tradeInfo">
                    <div class="info-item">
                        <div class="info-label">最新价</div>
                        <div class="info-value" id="currentPrice">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">涨跌幅</div>
                        <div class="info-value" id="priceChange">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">成交量</div>
                        <div class="info-value" id="currentVolume">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">市值</div>
                        <div class="info-value" id="marketCap">--</div>
                    </div>
                </div>
            </div>
            
            <!-- Level II 买卖盘 -->
            <div class="panel-header">
                <i class="fas fa-layer-group"></i>
                Level II 买卖盘
            </div>
            <div class="level2-container">
                <div class="level2-header">
                    <div style="text-align: center;">买盘 (Bid)</div>
                    <div></div>
                    <div style="text-align: center;">卖盘 (Ask)</div>
                </div>
                <div class="level2-content">
                    <div class="bid-side" id="bidSide">
                        <div class="loading">
                            <div class="spinner"></div>
                            加载买盘数据...
                        </div>
                    </div>
                    <div class="ask-side" id="askSide">
                        <div class="loading">
                            <div class="spinner"></div>
                            加载卖盘数据...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ProfessionalTradingDashboard {
            constructor() {
                this.socket = io();
                this.stocks = new Map();
                this.currentSymbol = 'QQQ';
                this.candlestickChart = null;
                this.priceHistory = new Map();
                this.level2Data = new Map();
                this.stats = {
                    dataCount: 0,
                    startTime: Date.now(),
                    lastUpdate: Date.now()
                };
                
                this.initializeCharts();
                this.setupSocketListeners();
                this.setupEventListeners();
                this.startStatsUpdater();
            }
            
            initializeCharts() {
                // 初始化K线图
                this.candlestickChart = echarts.init(document.getElementById('candlestickChart'), 'dark');
                
                const option = {
                    animation: true,
                    legend: {
                        data: ['K线', 'MA5', 'MA10', 'MA20'],
                        textStyle: { color: '#ccc' },
                        top: 10,
                        left: 10
                    },
                    grid: [{
                        left: '8%',
                        right: '8%',
                        height: '65%'
                    }, {
                        left: '8%',
                        right: '8%',
                        top: '75%',
                        height: '20%'
                    }],
                    xAxis: [{
                        type: 'category',
                        data: [],
                        scale: true,
                        boundaryGap: false,
                        axisLine: { onZero: false },
                        splitLine: { show: false },
                        axisLabel: { color: '#888' },
                        min: 'dataMin',
                        max: 'dataMax'
                    }, {
                        type: 'category',
                        gridIndex: 1,
                        data: [],
                        scale: true,
                        boundaryGap: false,
                        axisLine: { onZero: false },
                        axisTick: { show: false },
                        splitLine: { show: false },
                        axisLabel: { show: false },
                        min: 'dataMin',
                        max: 'dataMax'
                    }],
                    yAxis: [{
                        scale: true,
                        axisLabel: { color: '#888' },
                        splitArea: { show: true }
                    }, {
                        scale: true,
                        gridIndex: 1,
                        splitNumber: 2,
                        axisLabel: { show: false },
                        axisLine: { show: false },
                        axisTick: { show: false },
                        splitLine: { show: false }
                    }],
                    dataZoom: [{
                        type: 'inside',
                        xAxisIndex: [0, 1],
                        start: 50,
                        end: 100
                    }, {
                        show: true,
                        xAxisIndex: [0, 1],
                        type: 'slider',
                        top: '85%',
                        start: 50,
                        end: 100,
                        backgroundColor: '#2a2a2a',
                        fillerColor: 'rgba(100, 181, 246, 0.2)',
                        borderColor: '#444',
                        handleStyle: { color: '#64b5f6' },
                        textStyle: { color: '#888' }
                    }],
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'cross',
                            link: { xAxisIndex: 'all' }
                        },
                        backgroundColor: 'rgba(26, 26, 26, 0.95)',
                        borderColor: '#444',
                        textStyle: { color: '#fff' },
                        formatter: function (params) {
                            let result = `时间: ${params[0].axisValue}<br/>`;
                            params.forEach(param => {
                                if (param.seriesName === 'K线' && param.data) {
                                    result += `开盘: ${param.data[1]}<br/>`;
                                    result += `最高: ${param.data[4]}<br/>`;
                                    result += `最低: ${param.data[3]}<br/>`;
                                    result += `收盘: ${param.data[2]}<br/>`;
                                } else {
                                    result += `${param.seriesName}: ${param.data}<br/>`;
                                }
                            });
                            return result;
                        }
                    },
                    axisPointer: {
                        link: { xAxisIndex: 'all' },
                        label: {
                            backgroundColor: '#777'
                        }
                    },
                    brush: {
                        xAxisIndex: 'all',
                        brushLink: 'all',
                        outOfBrush: { colorAlpha: 0.1 }
                    },
                    series: [{
                        name: 'K线',
                        type: 'candlestick',
                        data: [],
                        itemStyle: {
                            color: '#4ade80',
                            color0: '#f87171',
                            borderColor: '#4ade80',
                            borderColor0: '#f87171'
                        },
                        markPoint: {
                            label: {
                                formatter: function (param) {
                                    return param != null ? Math.round(param.value) + '' : '';
                                }
                            },
                            data: [{
                                name: '最高值',
                                type: 'max',
                                valueDim: 'highest'
                            }, {
                                name: '最低值',
                                type: 'min',
                                valueDim: 'lowest'
                            }],
                            tooltip: { formatter: function (param) {
                                return param.name + '<br>' + (param.data.coord || '');
                            }}
                        }
                    }, {
                        name: 'MA5',
                        type: 'line',
                        data: [],
                        smooth: true,
                        lineStyle: { opacity: 0.8, width: 1, color: '#64b5f6' },
                        symbol: 'none'
                    }, {
                        name: 'MA10',
                        type: 'line',
                        data: [],
                        smooth: true,
                        lineStyle: { opacity: 0.8, width: 1, color: '#fbbf24' },
                        symbol: 'none'
                    }, {
                        name: 'MA20',
                        type: 'line',
                        data: [],
                        smooth: true,
                        lineStyle: { opacity: 0.8, width: 1, color: '#f87171' },
                        symbol: 'none'
                    }, {
                        name: '成交量',
                        type: 'bar',
                        xAxisIndex: 1,
                        yAxisIndex: 1,
                        data: [],
                        itemStyle: {
                            color: function(params) {
                                return params.dataIndex % 2 === 0 ? '#4ade80' : '#f87171';
                            }
                        }
                    }]
                };
                
                this.candlestickChart.setOption(option);
            }
            
            setupSocketListeners() {
                this.socket.on('connect', () => {
                    this.updateConnectionStatus('connected', '已连接到服务器');
                });
                
                this.socket.on('disconnect', () => {
                    this.updateConnectionStatus('disconnected', '与服务器断开连接');
                });
                
                this.socket.on('connectionStatus', (data) => {
                    this.updateConnectionStatus(data.status, data.message);
                });
                
                this.socket.on('initialData', (data) => {
                    if (data.stocks) {
                        data.stocks.forEach(([symbol, stockData]) => {
                            this.stocks.set(symbol, stockData);
                        });
                        this.updateStockList();
                        this.updateCurrentStock();
                    }
                });
                
                this.socket.on('stockUpdate', (stockData) => {
                    this.stocks.set(stockData.symbol, stockData);
                    this.stats.dataCount++;
                    this.stats.lastUpdate = Date.now();
                    
                    this.updateStockList();
                    if (stockData.symbol === this.currentSymbol) {
                        this.updateCurrentStock();
                        this.updateChart();
                    }
                });
                
                this.socket.on('level2Update', (data) => {
                    console.log('📚 收到Level II数据:', data);
                    this.level2Data.set(data.symbol, data);
                    if (data.symbol === this.currentSymbol) {
                        this.updateLevel2Display(data);
                    }
                });
            }
            
            setupEventListeners() {
                // 股票选择
                document.getElementById('stockList').addEventListener('click', (e) => {
                    const stockItem = e.target.closest('.stock-item');
                    if (stockItem) {
                        const symbol = stockItem.dataset.symbol;
                        this.selectStock(symbol);
                    }
                });
                
                // 时间周期切换
                document.querySelectorAll('.chart-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.chart-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.updateChart();
                    });
                });
                
                // 窗口大小变化
                window.addEventListener('resize', () => {
                    this.candlestickChart?.resize();
                });
            }
            
            updateConnectionStatus(status, message) {
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                
                statusText.textContent = message;
                
                switch (status) {
                    case 'connected':
                        statusDot.style.background = '#4ade80';
                        break;
                    case 'disconnected':
                        statusDot.style.background = '#f87171';
                        break;
                    case 'error':
                        statusDot.style.background = '#fbbf24';
                        break;
                    default:
                        statusDot.style.background = '#94a3b8';
                }
            }
            
            updateStockList() {
                const stockList = document.getElementById('stockList');
                stockList.innerHTML = '';
                
                Array.from(this.stocks.values()).forEach(stock => {
                    const item = document.createElement('div');
                    item.className = `stock-item ${stock.symbol === this.currentSymbol ? 'active' : ''}`;
                    item.dataset.symbol = stock.symbol;
                    
                    const changeClass = stock.change > 0 ? 'positive' : stock.change < 0 ? 'negative' : 'neutral';
                    const changeSymbol = stock.change > 0 ? '+' : '';
                    
                    item.innerHTML = `
                        <div class="stock-symbol">${stock.symbol}</div>
                        <div class="stock-price ${changeClass}">$${stock.price?.toFixed(2) || '--'}</div>
                        <div class="stock-change ${changeClass}">
                            ${changeSymbol}${stock.change?.toFixed(2) || '0.00'} 
                            (${changeSymbol}${stock.changePercent?.toFixed(2) || '0.00'}%)
                        </div>
                        <div class="stock-volume">成交量: ${stock.volume?.toLocaleString() || '--'}</div>
                    `;
                    
                    stockList.appendChild(item);
                });
            }
            
            selectStock(symbol) {
                this.currentSymbol = symbol;
                document.getElementById('currentSymbol').textContent = symbol;
                
                // 更新选中状态
                document.querySelectorAll('.stock-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.symbol === symbol);
                });
                
                this.updateCurrentStock();
                this.updateChart();
                
                // 更新Level II显示
                const level2Data = this.level2Data.get(symbol);
                this.updateLevel2Display(level2Data);
            }
            
            updateCurrentStock() {
                const stock = this.stocks.get(this.currentSymbol);
                if (!stock) return;
                
                const changeClass = stock.change > 0 ? 'positive' : stock.change < 0 ? 'negative' : 'neutral';
                const changeSymbol = stock.change > 0 ? '+' : '';
                
                document.getElementById('currentPrice').textContent = `$${stock.price?.toFixed(2) || '--'}`;
                document.getElementById('currentPrice').className = `info-value ${changeClass}`;
                
                document.getElementById('priceChange').textContent = 
                    `${changeSymbol}${stock.change?.toFixed(2) || '0.00'} (${changeSymbol}${stock.changePercent?.toFixed(2) || '0.00'}%)`;
                document.getElementById('priceChange').className = `info-value ${changeClass}`;
                
                document.getElementById('currentVolume').textContent = stock.volume?.toLocaleString() || '--';
                document.getElementById('marketCap').textContent = stock.marketCap ? 
                    `$${(stock.marketCap / 1e9).toFixed(2)}B` : '--';
            }
            
            updateChart() {
                // 这里应该根据选中的股票和时间周期更新K线图
                // 暂时使用模拟数据
                const dates = [];
                const candleData = [];
                const volumeData = [];
                
                for (let i = 0; i < 50; i++) {
                    const date = new Date(Date.now() - (49 - i) * 60000);
                    dates.push(date.toLocaleTimeString());
                    
                    const open = 100 + Math.random() * 50;
                    const close = open + (Math.random() - 0.5) * 10;
                    const high = Math.max(open, close) + Math.random() * 5;
                    const low = Math.min(open, close) - Math.random() * 5;
                    
                    candleData.push([open, close, low, high]);
                    volumeData.push(Math.floor(Math.random() * 1000000));
                }
                
                this.candlestickChart.setOption({
                    xAxis: [{ data: dates }, { data: dates }],
                    series: [{
                        data: candleData
                    }, {
                        data: this.calculateMA(candleData, 5)
                    }, {
                        data: this.calculateMA(candleData, 10)
                    }, {
                        data: this.calculateMA(candleData, 20)
                    }, {
                        data: volumeData
                    }]
                });
            }
            
            calculateMA(data, period) {
                const result = [];
                for (let i = 0; i < data.length; i++) {
                    if (i < period - 1) {
                        result.push(null);
                    } else {
                        let sum = 0;
                        for (let j = 0; j < period; j++) {
                            sum += data[i - j][1]; // 使用收盘价
                        }
                        result.push((sum / period).toFixed(2));
                    }
                }
                return result;
            }
            
            updateLevel2Display(level2Data) {
                const bidSide = document.getElementById('bidSide');
                const askSide = document.getElementById('askSide');
                
                bidSide.innerHTML = '';
                askSide.innerHTML = '';
                
                if (!level2Data) {
                    // 显示无数据状态
                    bidSide.innerHTML = '<div class="loading">等待买盘数据...</div>';
                    askSide.innerHTML = '<div class="loading">等待卖盘数据...</div>';
                    return;
                }
                
                // 显示买盘数据
                if (level2Data.bidLevels && level2Data.bidLevels.length > 0) {
                    level2Data.bidLevels.forEach(level => {
                        const row = document.createElement('div');
                        row.className = 'level2-row bid-row';
                        const generatedMark = level.isGenerated ? '*' : '';
                        row.innerHTML = `
                            <div class="level2-count">${level.marketMakers}</div>
                            <div class="level2-size">${level.size}</div>
                            <div class="level2-price bid-color">$${level.price.toFixed(2)}${generatedMark}</div>
                        `;
                        bidSide.appendChild(row);
                    });
                } else {
                    bidSide.innerHTML = '<div class="loading">无买盘数据</div>';
                }
                
                // 显示卖盘数据
                if (level2Data.askLevels && level2Data.askLevels.length > 0) {
                    level2Data.askLevels.forEach(level => {
                        const row = document.createElement('div');
                        row.className = 'level2-row ask-row';
                        const generatedMark = level.isGenerated ? '*' : '';
                        row.innerHTML = `
                            <div class="level2-price ask-color">$${level.price.toFixed(2)}${generatedMark}</div>
                            <div class="level2-size">${level.size}</div>
                            <div class="level2-count">${level.marketMakers}</div>
                        `;
                        askSide.appendChild(row);
                    });
                } else {
                    askSide.innerHTML = '<div class="loading">无卖盘数据</div>';
                }
            }
            
            startStatsUpdater() {
                setInterval(() => {
                    document.getElementById('dataCount').textContent = this.stats.dataCount.toLocaleString();
                    
                    const uptimeSeconds = Math.floor((Date.now() - this.stats.startTime) / 1000);
                    const hours = Math.floor(uptimeSeconds / 3600);
                    const minutes = Math.floor((uptimeSeconds % 3600) / 60);
                    const seconds = uptimeSeconds % 60;
                    
                    if (hours > 0) {
                        document.getElementById('uptime').textContent = `${hours}h ${minutes}m`;
                    } else if (minutes > 0) {
                        document.getElementById('uptime').textContent = `${minutes}m ${seconds}s`;
                    } else {
                        document.getElementById('uptime').textContent = `${seconds}s`;
                    }
                    
                    const latency = Date.now() - this.stats.lastUpdate;
                    document.getElementById('latency').textContent = `${latency}ms`;
                    
                }, 1000);
            }
        }
        
        // 启动专业交易仪表板
        document.addEventListener('DOMContentLoaded', () => {
            window.dashboard = new ProfessionalTradingDashboard();
        });
    </script>
</body>
