name: Validate Benchmark Host Sensitivity Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate benchmark gate profiles
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          rm -rf .artifacts/runtime-host-sensitive-check
          mkdir -p .artifacts/runtime-host-sensitive-check
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-host-sensitive-check/run-${run}.json"
          done
          npm run benchmark:runtime:check -- \
            --baseline bench/runtime-baseline.json \
            --current-dir .artifacts/runtime-host-sensitive-check \
            --min-samples 3 | tee /tmp/runtime-benchmark-check.log
          grep -q '^OBSERVE atomicPersistence.wallMs ' /tmp/runtime-benchmark-check.log
          grep -q 'gate-atomic-persistence' bench/check-runtime-benchmark.ts
          grep -q 'ATOMIC_PERSISTENCE_GATE_REQUIRES_5_SAMPLES' bench/check-runtime-benchmark.ts

      - name: Remove validation workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git rm .github/workflows/validate-benchmark-host-sensitivity-once.yml
          git commit -m 'chore: remove host-sensitive benchmark validation workflow'
          git push origin HEAD:refactor/enterprise-convergence-20260817
