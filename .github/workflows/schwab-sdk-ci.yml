name: Schwab Unified CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'bench/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'knip.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/schwab-sdk-ci.yml'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'bench/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'knip.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/schwab-sdk-ci.yml'
      - '.github/dependabot.yml'

concurrency:
  group: schwab-unified-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Build, typecheck, native-runtime audit, and unified contract tests
        run: npm test

      - name: Gate runtime benchmark medians
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json"
          done
          npm run benchmark:runtime:check -- \
            --baseline bench/runtime-baseline.json \
            --current-dir .artifacts/runtime-benchmark \
            --min-samples 3

      - name: Upload runtime benchmark evidence
        if: ${{ always() && hashFiles('.artifacts/runtime-benchmark/*.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-benchmark-${{ github.sha }}
          path: .artifacts/runtime-benchmark
          if-no-files-found: error
          retention-days: 30

      - name: Verify package export surface
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public.js
          test -f dist/public.d.ts
          test -f dist/automation/public.js
          test -f dist/automation/public.d.ts
          npm pack --dry-run --json > /tmp/npm-pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'));
          const files = new Set((data[0]?.files ?? []).map((entry) => entry.path));
          for (const required of ['dist/public.js', 'dist/public.d.ts', 'dist/automation/public.js', 'dist/automation/public.d.ts']) {
            if (!files.has(required)) throw new Error(`PACKAGE_EXPORT_MISSING:${required}`);
          }
          NODE

      - name: Verify repository invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d vendor
          test ! -e .github/workflows/enterprise-convergence-once.yml
          test ! -e .github/workflows/enterprise-finish-once.yml
          test ! -e scripts/enterprise-convergence-edit.mjs
          test ! -e scripts/enterprise-finish-edit.mjs
          if git grep -n 'vendor/schwab-api-nodejs' -- src test docs README.md package.json package-lock.json; then
            echo 'stale nested SDK path remains' >&2
            exit 1
          fi
