name: Schwab Unified CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/schwab-sdk-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/schwab-sdk-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck SDK and automation
        run: npm run typecheck

      - name: Build and run unified contract tests
        run: npm test

      - name: Verify single source tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d vendor
          if git grep -n 'vendor/schwab-api-nodejs' -- src test docs README.md package.json package-lock.json; then
            echo 'stale nested SDK path remains' >&2
            exit 1
          fi
