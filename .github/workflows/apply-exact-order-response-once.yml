name: Apply Exact Order Response Identity Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-exact-order-response-once.yml'
      - 'scripts/patch-exact-order-response.py'
      - 'src/automation/broker/exactOrderResponse.ts'
      - 'test/exact_order_response.test.ts'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/exact-order-response-identity-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/exact-order-response-identity-20260818
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply exact-order runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-exact-order-response.py
          rm scripts/patch-exact-order-response.py

      - name: Validate exact-order identity contract
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run lint:deadcode
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json" >/dev/null
          done
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current-dir .artifacts/runtime-benchmark --min-samples 3
          rm -rf .artifacts/runtime-benchmark
          git diff --check
          grep -q 'exactOrderRoot<Json>(response.body, canonicalOrderId)' src/automation/runtimeOrchestrator.ts
          grep -q 'canonicalOrderId = brokerOrderId' src/automation/runtimeOrchestrator.ts
          ! grep -q 'AUTHORITATIVE_ORDER_RESPONSE_INVALID' src/automation/runtimeOrchestrator.ts

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-exact-order-response-once.yml
          git commit -m 'fix: validate exact Schwab order response identity'
          git push origin HEAD:fix/exact-order-response-identity-20260818
