name: One-shot source tree unification v5

on:
  push:
    branches:
      - refactor/unify-sdk-automation-module

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vendor/schwab-api-nodejs/package-lock.json

      - name: Extract refactor script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/refactor-unify-source-tree.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Unify SDK and automation into one source tree\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Commit refactor\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          script = script.replace(
              "          test ! -e vendor/schwab-api-nodejs\n          ! git grep -n 'vendor/schwab-api-nodejs'",
              "          test ! -d vendor",
          )
          script = script.replace(
              "rm .github/workflows/refactor-unify-source-tree.yml",
              "rm .github/workflows/refactor-unify-source-tree.yml\nrm .github/workflows/refactor-unify-source-tree-v2.yml\nrm .github/workflows/refactor-unify-source-tree-v3.yml\nrm .github/workflows/refactor-unify-source-tree-v4.yml\nrm .github/workflows/refactor-unify-source-tree-v5.yml",
          )
          script = script.replace(
              "if git grep -n 'vendor/schwab-api-nodejs'; then",
              "if git grep -n 'vendor/schwab-api-nodejs' -- src test docs README.md package.json package-lock.json; then",
          )

          cleanup = r"""python - <<'PYFIX'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          old = 'function managedOpening(order: Json): Json | null {'
          if old not in text:
              raise SystemExit('MANAGED_OPENING_SIGNATURE_MISSING')
          text = text.replace(old, 'function managedOpening(order: Json): ReturnType<typeof orderInfo> {', 1)

          legacy_start = text.find('async function evaluateExitStrategyLegacy(')
          if legacy_start >= 0:
              active_start = text.find('\nasync function evaluateExitStrategy(', legacy_start)
              if active_start < 0:
                  raise SystemExit('ACTIVE_EXIT_STRATEGY_MARKER_MISSING')
              text = text[:legacy_start] + text[active_start + 1:]

          old = 'await activityStream?.stop();'
          if old not in text:
              raise SystemExit('ACTIVITY_STREAM_STOP_MISSING')
          text = text.replace(old, 'const streamToStop = activityStream as SchwabActivityStream | null;\nif (streamToStop) await streamToStop.stop();', 1)
          main.write_text(text, encoding='utf-8')

          policy = Path('src/order_policy.ts')
          text = policy.read_text(encoding='utf-8')
          old_line = '  const parsed = legs.map((leg: Json) => parseOcc(String(leg.instrument?.symbol ?? "")));'
          replacement = '  const first = parseOcc(String(legs[0]?.instrument?.symbol ?? ""));\n  const second = parseOcc(String(legs[1]?.instrument?.symbol ?? ""));\n  if (!first || !second) return null;\n  const parsed: [Json, Json] = [first, second];'
          if old_line not in text:
              raise SystemExit('ORDER_POLICY_PARSE_LINE_MISSING')
          text = text.replace(old_line, replacement, 1)
          text = text.replace('  if (parsed.some((value: Json | null) => value === null)) return null;\n', '', 1)
          text = text.replace('  if (parsed[0].underlying !== parsed[1].underlying || parsed[0].expiration !== parsed[1].expiration) return null;', '  if (first.underlying !== second.underlying || first.expiration !== second.expiration) return null;', 1)
          policy.write_text(text, encoding='utf-8')

          lock = Path('src/runtime_lock.ts')
          text = lock.read_text(encoding='utf-8')
          old_line = '      || !Number.isInteger(value.pid)'
          if old_line not in text:
              raise SystemExit('RUNTIME_LOCK_PID_GUARD_MISSING')
          text = text.replace(old_line, '      || typeof value.pid !== "number"\n      || !Number.isInteger(value.pid)', 1)
          lock.write_text(text, encoding='utf-8')

          reconciliation_test = Path('test/unknown_write_reconciliation.test.ts')
          text = reconciliation_test.read_text(encoding='utf-8')
          marker = '.map((leg) => ({'
          if text.count(marker) != 2:
              raise SystemExit('UNKNOWN_WRITE_TEST_LEG_CALLBACK_COUNT_CHANGED')
          reconciliation_test.write_text(
              text.replace(marker, '.map((leg: Record<string, any>) => ({'),
              encoding='utf-8',
          )
          PYFIX

          """
          script = script.replace('\nnpm ci\n', '\n' + cleanup + 'npm ci\n', 1)
          Path('/tmp/unify-source-tree.sh').write_text(script, encoding='utf-8')
          PY
          chmod +x /tmp/unify-source-tree.sh

      - name: Execute and validate refactor
        shell: bash
        run: /tmp/unify-source-tree.sh

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: unify Schwab SDK and automation source tree'
          git push origin HEAD:refactor/unify-sdk-automation-module
