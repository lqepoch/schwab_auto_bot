name: Enterprise dead-code inventory one-shot

on:
  push:
    branches:
      - audit/enterprise-dead-code-20260817

permissions:
  contents: read

jobs:
  knip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked project dependencies
        run: npm ci --ignore-scripts

      - name: Inventory example imports
        shell: bash
        run: |
          set -euo pipefail
          grep -R -nE "^import .*from ['\"].*\\.js['\"]" examples --include='*.ts' || true

      - name: Validate dead files and dependency graph
        run: npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
