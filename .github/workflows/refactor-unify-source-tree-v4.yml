name: One-shot source tree unification v4

on:
  push:
    branches:
      - refactor/unify-sdk-automation-module

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vendor/schwab-api-nodejs/package-lock.json

      - name: Extract refactor script with strict type cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/refactor-unify-source-tree.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Unify SDK and automation into one source tree\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Commit refactor\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          script = script.replace(
              "          test ! -e vendor/schwab-api-nodejs\n          ! git grep -n 'vendor/schwab-api-nodejs'",
              "          test ! -d vendor",
          )
          script = script.replace(
              "rm .github/workflows/refactor-unify-source-tree.yml",
              "rm .github/workflows/refactor-unify-source-tree.yml\nrm .github/workflows/refactor-unify-source-tree-v2.yml\nrm .github/workflows/refactor-unify-source-tree-v3.yml\nrm .github/workflows/refactor-unify-source-tree-v4.yml",
          )
          script = script.replace(
              "if git grep -n 'vendor/schwab-api-nodejs'; then",
              "if git grep -n 'vendor/schwab-api-nodejs' -- src test docs README.md package.json package-lock.json; then",
          )

          cleanup = r"""python - <<'PYFIX'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              'function managedOpening(order: Json): Json | null {',
              'function managedOpening(order: Json): ReturnType<typeof orderInfo> {',
              1,
          )
          legacy_start = text.find('async function evaluateExitStrategyLegacy(')
          if legacy_start >= 0:
              active_start = text.find('\nasync function evaluateExitStrategy(', legacy_start)
              if active_start < 0:
                  raise SystemExit('ACTIVE_EXIT_STRATEGY_MARKER_MISSING')
              text = text[:legacy_start] + text[active_start + 1:]
          text = text.replace(
              'await activityStream?.stop();',
              'const streamToStop = activityStream as SchwabActivityStream | null;\nif (streamToStop) await streamToStop.stop();',
              1,
          )
          main.write_text(text, encoding='utf-8')

          policy = Path('src/order_policy.ts')
          text = policy.read_text(encoding='utf-8')
          old = '''  const parsed = legs.map((leg: Json) => parseOcc(String(leg.instrument?.symbol ?? "")));
          if (parsed.some((value: Json | null) => value === null)) return null;
          if (parsed[0].underlying !== parsed[1].underlying || parsed[0].expiration !== parsed[1].expiration) return null;'''
          new = '''  const first = parseOcc(String(legs[0]?.instrument?.symbol ?? ""));
          const second = parseOcc(String(legs[1]?.instrument?.symbol ?? ""));
          if (!first || !second) return null;
          const parsed: [Json, Json] = [first, second];
          if (first.underlying !== second.underlying || first.expiration !== second.expiration) return null;'''
          if old not in text:
              raise SystemExit('ORDER_POLICY_PARSE_BLOCK_MISSING')
          policy.write_text(text.replace(old, new, 1), encoding='utf-8')

          lock = Path('src/runtime_lock.ts')
          text = lock.read_text(encoding='utf-8')
          old = '''      value.schemaVersion !== 1
                || !Number.isInteger(value.pid)
                || value.pid <= 0'''
          new = '''      value.schemaVersion !== 1
                || typeof value.pid !== "number"
                || !Number.isInteger(value.pid)
                || value.pid <= 0'''
          if old not in text:
              raise SystemExit('RUNTIME_LOCK_PID_GUARD_MISSING')
          lock.write_text(text.replace(old, new, 1), encoding='utf-8')
          PYFIX

          """
          script = script.replace('\nnpm ci\n', '\n' + cleanup + 'npm ci\n', 1)
          Path('/tmp/unify-source-tree.sh').write_text(script, encoding='utf-8')
          PY
          chmod +x /tmp/unify-source-tree.sh

      - name: Execute and validate refactor
        shell: bash
        run: /tmp/unify-source-tree.sh

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: unify Schwab SDK and automation source tree'
          git push origin HEAD:refactor/unify-sdk-automation-module
