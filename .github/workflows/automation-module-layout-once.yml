name: Automation Module Layout Migration

on:
  push:
    branches:
      - refactor/automation-module-layout-20260817

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Normalize automation source layout
        run: python3 scripts/automation-layout-migrate.py

      - name: Validate unified automation module
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          mkdir -p .artifacts
          npm run benchmark:runtime -- --output .artifacts/runtime-benchmark.json
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current .artifacts/runtime-benchmark.json
          npm pack --dry-run --json > /tmp/npm-pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'));
          const files = new Set((data[0]?.files ?? []).map((entry) => entry.path));
          for (const required of ['dist/public.js', 'dist/public.d.ts', 'dist/automation/public.js', 'dist/automation/public.d.ts']) {
            if (!files.has(required)) throw new Error(`PACKAGE_EXPORT_MISSING:${required}`);
          }
          NODE
          git diff --check
          test ! -e src/auth.ts
          test ! -e src/schwab_client.ts
          test ! -e src/order_policy.ts
          root_ts="$(find src -maxdepth 1 -type f -name '*.ts' -printf '%f\n' | sort | tr '\n' ' ')"
          test "$root_ts" = "index.ts main.ts public.ts "
          rm -rf .artifacts

      - name: Commit migration if changed
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/automation-module-layout-once.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git add -A
          git status --short
          git commit -m 'refactor: normalize automation module layout [layout-once]'
          git push origin HEAD:refactor/automation-module-layout-20260817
