name: Validate Hot Switch Identity Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate hot-switch identity and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          npm test
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'Test-HotSwitchRuntimeLockMatchesState' scripts/hot-switch.ps1
          grep -q 'ACTIVE_RUN_ENTRY_NOT_APPROVED' scripts/hot-switch.ps1
          grep -q 'STALE_CONTROL_REQUEST_PRESENT' scripts/hot-switch.ps1
          grep -q 'REPLACEMENT_BUILD_ID_MISMATCH' scripts/hot-switch.ps1

      - name: Remove validation workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git rm .github/workflows/validate-hot-switch-identity-once.yml
          git commit -m 'chore: remove hot-switch identity validation workflow'
          git push origin HEAD:refactor/enterprise-convergence-20260817
