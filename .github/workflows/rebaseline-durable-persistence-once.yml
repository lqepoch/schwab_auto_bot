name: Rebaseline Durable Persistence Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build seven-sample durable persistence baseline
        shell: bash
        run: |
          set -euo pipefail
          npm test
          rm -rf .artifacts/runtime-rebaseline .artifacts/runtime-recheck
          mkdir -p .artifacts/runtime-rebaseline .artifacts/runtime-recheck
          for run in 1 2 3 4 5 6 7; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-rebaseline/run-${run}.json"
          done
          npm run benchmark:runtime:baseline -- \
            --inputs .artifacts/runtime-rebaseline \
            --output .artifacts/runtime-rebaseline/candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline_path = Path('bench/runtime-baseline.json')
          candidate_path = Path('.artifacts/runtime-rebaseline/candidate.json')
          baseline = json.loads(baseline_path.read_text())
          candidate = json.loads(candidate_path.read_text())
          if candidate['nodeMajor'] != baseline['nodeMajor'] or candidate['seed'] != baseline['seed'] or candidate['corpusSize'] != baseline['corpusSize']:
              raise SystemExit('incompatible runtime benchmark baseline candidate')
          baseline['generatedAt'] = candidate['generatedAt']
          baseline['sampleCount'] = candidate['sampleCount']
          baseline['metrics']['atomicPersistence.wallMs'] = candidate['metrics']['atomicPersistence.wallMs']
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n')
          print(json.dumps(baseline['metrics']['atomicPersistence.wallMs']))
          PY
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-recheck/run-${run}.json"
          done
          npm run benchmark:runtime:check -- \
            --baseline bench/runtime-baseline.json \
            --current-dir .artifacts/runtime-recheck \
            --min-samples 3
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check

      - name: Commit calibrated persistence baseline and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git rm .github/workflows/rebaseline-durable-persistence-once.yml
          git add bench/runtime-baseline.json
          git diff --cached --check
          git commit -m 'bench: recalibrate crash-durable persistence baseline'
          git push origin HEAD:refactor/enterprise-convergence-20260817
