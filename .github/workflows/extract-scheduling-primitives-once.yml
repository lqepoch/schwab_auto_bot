name: Extract Scheduling Primitives Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply scheduling extraction
        run: |
          set -euo pipefail
          python3 scripts/extract-scheduling-primitives.py
          rm scripts/extract-scheduling-primitives.py

      - name: Validate extracted scheduling behavior
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json"
          done
          npm run benchmark:runtime:check -- \
            --baseline bench/runtime-baseline.json \
            --current-dir .artifacts/runtime-benchmark \
            --min-samples 3
          rm -rf .artifacts
          git diff --check
          test -f src/automation/scheduling/requestBudget.ts
          test -f src/automation/scheduling/explorerActionPacer.ts
          if grep -q '^class RequestBudget' src/automation/runtimeOrchestrator.ts; then
            echo 'embedded RequestBudget remains' >&2
            exit 1
          fi
          if grep -q '^class ExplorerActionPacer' src/automation/runtimeOrchestrator.ts; then
            echo 'embedded ExplorerActionPacer remains' >&2
            exit 1
          fi

      - name: Commit extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git add -A
          git status --short
          git commit -m 'refactor: extract automation scheduling primitives'
          git push origin HEAD:refactor/enterprise-convergence-20260817
