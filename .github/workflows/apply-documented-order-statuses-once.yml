name: Apply Documented Order Statuses Once

on:
  push:
    branches:
      - fix/documented-order-status-contract-20260818

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: align automation working statuses with Schwab contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply status contract patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-documented-order-statuses.py
          rm scripts/patch-documented-order-statuses.py

      - name: Validate status contract
        shell: bash
        run: |
          set -euo pipefail
          npm test
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          ! grep -q 'PARTIALLY_FILLED' src/automation/runtimeOrchestrator.ts
          ! grep -q 'PARTIALLY_FILLED' src/automation/execution/orderWritePreflight.ts
          grep -q 'AUTOMATION_WORKING_ORDER_STATUSES' src/automation/runtimeOrchestrator.ts
          grep -q 'AUTOMATION_WORKING_ORDER_STATUSES' bench/runtime-benchmark.ts

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-documented-order-statuses-once.yml
          git commit -m 'fix: align automation working statuses with Schwab contract'
          git push origin HEAD:fix/documented-order-status-contract-20260818
