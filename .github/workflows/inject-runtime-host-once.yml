name: Inject Runtime Host Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply runtime host injection
        run: |
          set -euo pipefail
          python3 scripts/inject-runtime-host.py
          rm scripts/inject-runtime-host.py

      - name: Validate embeddable runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'runAutomationRuntime(options: AutomationRuntimeOptions = {})' src/automation/runtimeOrchestrator.ts
          grep -q 'resolveAutomationRuntimeHost(options' src/automation/runtimeOrchestrator.ts
          grep -q 'bindRuntimeProcessHandlers(host.processEvents' src/automation/runtimeOrchestrator.ts
          grep -q 'entryPath: host.entryPath' src/automation/runtimeOrchestrator.ts
          if grep -E -n 'process\.(argv|env|pid|execPath|stderr|on|once|off)' src/automation/runtimeOrchestrator.ts; then
            echo 'process-global runtime coupling remains' >&2
            exit 1
          fi

      - name: Commit injection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git add -A
          git status --short
          git commit -m 'refactor: inject automation runtime host boundary'
          git push origin HEAD:refactor/enterprise-convergence-20260817
