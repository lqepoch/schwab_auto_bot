name: SDK Hotpath Refactor

on:
  push:
    branches:
      - perf/sdk-hotpaths-20260819

permissions:
  contents: write

concurrency:
  group: sdk-hotpath-refactor
  cancel-in-progress: true

jobs:
  refactor-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: perf/sdk-hotpaths-20260819
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply batch option-quote indexing
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/clients/marketData.ts')
          source = source_path.read_text()

          old_lookup = """    const observedAt = Date.now();
              return normalizedSymbols.map((symbol) => {
                const item = this.findQuoteItem(response, symbol);
          """
          new_lookup = """    const quoteItems = this.indexQuoteItems(response);
              const observedAt = Date.now();
              return normalizedSymbols.map((symbol) => {
                const item = quoteItems.get(symbol);
          """
          if source.count(old_lookup) != 1:
              raise SystemExit(f'lookup block match count={source.count(old_lookup)}')
          source = source.replace(old_lookup, new_lookup, 1)

          old_helper = """  private findQuoteItem(response: QuotesResponse, symbol: string): QuoteItem | undefined {
              return response[symbol]
                ?? Object.values(response).find((item) => item.symbol === symbol || item.symbol?.trimEnd() === symbol.trimEnd());
            }
          """
          new_helper = """  private indexQuoteItems(response: QuotesResponse): ReadonlyMap<string, QuoteItem> {
              const entries = Object.entries(response);
              const index = new Map<string, QuoteItem>();
              for (const [key, item] of entries) index.set(key, item);
              for (const [, item] of entries) {
                const itemSymbol = item.symbol;
                if (itemSymbol && !index.has(itemSymbol)) index.set(itemSymbol, item);
                const normalized = itemSymbol?.trimEnd();
                if (normalized && !index.has(normalized)) index.set(normalized, item);
              }
              return index;
            }
          """
          if source.count(old_helper) != 1:
              raise SystemExit(f'helper block match count={source.count(old_helper)}')
          source = source.replace(old_helper, new_helper, 1)
          source_path.write_text(source)

          test_path = Path('test/optionQuotes.test.mjs')
          tests = test_path.read_text()
          marker = "batch option quote lookup builds one normalized response index"
          if marker not in tests:
              tests += r'''

test('batch option quote lookup builds one normalized response index', async () => {
  const first = 'QQQ   260814P00740000';
  const second = 'QQQ   260814P00739000';
  const { client, calls } = makeClient({
    opaqueA: optionItem(`${first} `, { bid: 29.9, ask: 30.1, strike: 740 }),
    opaqueB: optionItem(`${second} `, { bid: 28.95, ask: 29.05, strike: 739 }),
  });
  const quotes = await client.getOptionQuotes([first, second]);
  assert.equal(quotes.length, 2);
  assert.equal(quotes[0].strike, 740);
  assert.equal(quotes[1].strike, 739);
  assert.equal(calls.length, 1);
});

test('batch option quote source avoids per-symbol full response scans', async () => {
  const { readFile } = await import('node:fs/promises');
  const source = await readFile(new URL('../src/clients/marketData.ts', import.meta.url), 'utf8');
  assert.match(source, /const quoteItems = this\.indexQuoteItems\(response\);/);
  assert.doesNotMatch(source, /Object\.values\(response\)\.find/);
});
'''
              test_path.write_text(tests)

      - name: Validate full contracts
        run: |
          npm test
          npm run lint:deadcode
          git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/clients/marketData.ts test/optionQuotes.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'perf: index batch option quote lookups'
          git push origin HEAD:perf/sdk-hotpaths-20260819
