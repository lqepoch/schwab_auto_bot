name: Apply Runtime Order Index Cache Once

on:
  push:
    branches:
      - perf/cache-derived-order-index-20260818

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'perf: cache derived runtime order views by authority revision'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: perf/cache-derived-order-index-20260818
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply runtime order-index integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-runtime-order-index-cache.py
          rm scripts/patch-runtime-order-index-cache.py

      - name: Validate runtime order-index cache
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run lint:deadcode
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json" >/dev/null
          done
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current-dir .artifacts/runtime-benchmark --min-samples 3
          rm -rf .artifacts/runtime-benchmark
          git diff --check
          grep -q 'const runtimeOrderIndex = new RuntimeOrderIndexCache()' src/automation/runtimeOrchestrator.ts
          grep -q 'orderAuthorityRevision += 1' src/automation/runtimeOrchestrator.ts
          grep -q 'currentActiveClosingOrders' src/automation/runtimeOrchestrator.ts
          ! grep -q 'orders.filter((order) => {' <(sed -n '/async function evaluateExitStrategy/,/function evaluateExits/p' src/automation/runtimeOrchestrator.ts)

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-runtime-order-index-cache-once.yml
          git commit -m 'perf: cache derived runtime order views by authority revision'
          git push origin HEAD:perf/cache-derived-order-index-20260818
