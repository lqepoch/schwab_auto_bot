name: Apply Runtime Order Lookup Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-order-lookup-once.yml'
      - 'scripts/patch-runtime-order-lookup.py'
      - 'src/automation/broker/orderLookup.ts'
      - 'test/order_lookup.test.ts'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/runtime-order-lookup-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: perf/runtime-order-lookup-20260818
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply indexed lookup patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-runtime-order-lookup.py
          rm scripts/patch-runtime-order-lookup.py

      - name: Validate indexed lookup
        shell: bash
        run: |
          set -euo pipefail
          npm test
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json" >/dev/null
          done
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current-dir .artifacts/runtime-benchmark --min-samples 3
          git diff --check
          ! grep -q 'orders\.find(' src/automation/runtimeOrchestrator.ts
          grep -q 'ordersById = new OrderLookup' src/automation/runtimeOrchestrator.ts
          grep -q 'replaceOrders(incoming)' src/automation/runtimeOrchestrator.ts
          grep -q 'addOrder(localOrder(payload, id))' src/automation/runtimeOrchestrator.ts

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-runtime-order-lookup-once.yml
          git commit -m 'perf: index authoritative orders by broker ID'
          git push origin HEAD:perf/runtime-order-lookup-20260818
