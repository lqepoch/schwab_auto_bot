name: Repository Path Fix Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply repository path patch
        run: |
          set -euo pipefail
          python3 scripts/repository-path-fix.py
          rm scripts/repository-path-fix.py

      - name: Validate source and dist path semantics
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'defaultAutomationAuthStatePath(import.meta.url)' src/automation/auth/provider.ts
          grep -q 'repositoryRootFromAutomationModuleUrl(import.meta.url)' src/automation/runtimeOrchestrator.ts
          if grep -q 'dirname(dirname(fileURLToPath(import.meta.url)))' src/automation/auth/provider.ts; then
            echo 'stale depth-sensitive auth path remains' >&2
            exit 1
          fi

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git add -A
          git status --short
          git commit -m 'fix: keep automation state paths anchored to repository root'
          git push origin HEAD:refactor/enterprise-convergence-20260817
