name: Inject Automation Auth Environment Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply auth environment injection
        run: |
          set -euo pipefail
          python3 scripts/inject-auth-environment.py
          rm scripts/inject-auth-environment.py

      - name: Validate injected auth boundary
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'AutomationAuthOptions' src/automation/auth/provider.ts
          grep -q 'new SchwabTokenProvider(stamp, automationAuthOptions)' src/automation/runtimeOrchestrator.ts
          grep -q 'beginLogin: () => beginLogin(automationAuthOptions)' src/automation/runtimeOrchestrator.ts
          grep -q 'login: (callbackUrl, state) => login(callbackUrl, state, automationAuthOptions)' src/automation/runtimeOrchestrator.ts
          if grep -q 'const statePath = process.env.SCHWAB_BOT_AUTH_FILE' src/automation/auth/provider.ts; then
            echo 'module-level process auth state remains' >&2
            exit 1
          fi

      - name: Commit injection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git add -A
          git status --short
          git commit -m 'refactor: inject automation auth environment boundary'
          git push origin HEAD:refactor/enterprise-convergence-20260817
