name: Apply Unknown Write Strict Identity Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-unknown-write-strict-identity-once.yml'
      - 'scripts/patch-unknown-write-strict-identity.py'
      - 'test/unknown_write_strict_identity.test.ts'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/unknown-write-strict-order-identity-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/unknown-write-strict-order-identity-20260818
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply strict reconciliation identity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-unknown-write-strict-identity.py
          rm scripts/patch-unknown-write-strict-identity.py

      - name: Validate strict recovery identity
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run lint:deadcode
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json" >/dev/null
          done
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current-dir .artifacts/runtime-benchmark --min-samples 3
          rm -rf .artifacts/runtime-benchmark
          git diff --check
          test "$(grep -o 'this.orderId(order)' src/automation/state/unknownWriteReconciliation.ts | wc -l)" -eq 5
          grep -q 'orderId: (order) => brokerOrderId(order)' src/automation/runtimeOrchestrator.ts

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-unknown-write-strict-identity-once.yml
          git commit -m 'fix: enforce strict broker IDs during UnknownWrite reconciliation'
          git push origin HEAD:fix/unknown-write-strict-order-identity-20260818
