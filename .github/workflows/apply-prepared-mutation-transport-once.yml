name: Apply Prepared Mutation Transport Once

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/enterprise-convergence-20260817
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply prepared mutation transport patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-prepared-mutation-transport.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/broker_write_post_intent_guard.test.ts')
          text = path.read_text()
          old = 'assert.equal(validations, 2);'
          if text.count(old) < 2:
              raise SystemExit('expected at least two legacy validation-count assertions')
          text = text.replace(old, 'assert.equal(validations, 3);', 2)
          path.write_text(text)
          PY
          rm scripts/patch-prepared-mutation-transport.py

      - name: Validate prepared mutation transport
        shell: bash
        run: |
          set -euo pipefail
          npm test
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'prepare(request: BrokerWriteRequest)' src/automation/broker/writeCoordinator.ts
          grep -q 'preparedTransport.send()' src/automation/broker/writeCoordinator.ts
          grep -q 'await budget.admit(request.transportPriority ?? 0)' src/automation/runtimeOrchestrator.ts
          grep -q 'const token = await tokens.get();' src/automation/runtimeOrchestrator.ts
          grep -q 'TARGET_CHANGED_DURING_TRANSPORT_PREPARE' test/broker_write_post_intent_guard.test.ts

      - name: Commit validated change and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git rm .github/workflows/apply-prepared-mutation-transport-once.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: prepare mutation transport before WAL persistence'
          git push origin HEAD:refactor/enterprise-convergence-20260817
