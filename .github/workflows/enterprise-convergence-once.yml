name: Enterprise convergence one-shot

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  convergence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply enterprise convergence
        shell: bash
        run: |
          set -euo pipefail
          echo ''' | base64 -d > /tmp/converge.py
          python /tmp/converge.py

      - name: Validate convergence
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          test "$(wc -l < src/main.ts)" -le 10
          ! grep -q 'new WebSocket' src/activity_stream.ts
          ! grep -q 'api.schwabapi.com/v1/oauth/token' src/auth.ts

      - name: Commit convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test/activity_stream.test.ts
          git commit -m 'refactor: converge runtime auth and activity transport'
          git push origin HEAD:refactor/enterprise-convergence-20260817
