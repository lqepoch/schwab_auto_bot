name: Enterprise dependency upgrades one-shot

on:
  push:
    branches:
      - chore/enterprise-dependency-upgrades-20260817

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current locked graph
        run: npm ci --ignore-scripts

      - name: Upgrade production and compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --save dotenv@17.4.2 open@11.0.1
          npm install --ignore-scripts --save-dev typescript@7.0.2
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src/index.ts';
          let text = fs.readFileSync(path, 'utf8');
          const before = "const result = loadEnvConfig({ path: envFilePath });";
          const after = "const result = loadEnvConfig({ path: envFilePath, quiet: true });";
          if (!text.includes(before)) throw new Error('DOTENV_CONFIG_CALL_NOT_FOUND');
          text = text.replace(before, after);
          fs.writeFileSync(path, text);
          NODE

      - name: Validate upgraded graph
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all
          npm audit --omit=dev --audit-level=high
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          npm run benchmark:runtime -- --output /tmp/runtime-benchmark.json
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current /tmp/runtime-benchmark.json
          npm pack --dry-run --json > /tmp/npm-pack.json
          git diff --check

      - name: Remove migration-only workflow
        run: git rm .github/workflows/enterprise-dependency-upgrades-once.yml

      - name: Commit validated dependency upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/index.ts
          git commit -m 'build: upgrade validated runtime dependencies and TypeScript'
          git push origin HEAD:chore/enterprise-dependency-upgrades-20260817
