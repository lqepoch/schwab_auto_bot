name: Refresh Knip Lock Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-knip-lock-once.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/schwab-sdk-ci.yml'
      - 'knip.json'

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'ci/pin-knip-deadcode-gate-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/pin-knip-deadcode-gate-20260818
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh lockfile from exact package manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Validate locked dead-code gate
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:deadcode
          npm test
          pwsh -NoProfile -File ./test/hot_switch_identity.test.ps1
          git diff --check
          node -e "const p=require('./package-lock.json'); if (p.packages['node_modules/knip']?.version !== '6.31.0') process.exit(1)"

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: lock Knip dead-code tooling'
          git push origin HEAD:ci/pin-knip-deadcode-gate-20260818
