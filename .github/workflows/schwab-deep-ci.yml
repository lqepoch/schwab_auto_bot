name: Schwab Deep Verification

on:
  schedule:
    - cron: '41 20 * * 1'
  workflow_dispatch:

concurrency:
  group: schwab-deep-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate dependency graph
        run: npm ls --all

      - name: Audit production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete build, source compatibility, examples, benchmarks typecheck, and tests
        run: npm test

      - name: Audit dead files and dependency hygiene
        run: npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact

      - name: Run scheduled runtime performance suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3 4 5; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json"
          done
          npm run benchmark:runtime:check -- \
            --baseline bench/runtime-baseline.json \
            --current-dir .artifacts/runtime-benchmark \
            --gate-event-loop

      - name: Upload scheduled runtime performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-runtime-benchmark-${{ github.sha }}
          path: .artifacts/runtime-benchmark
          if-no-files-found: error
          retention-days: 90

      - name: Validate publishable artifact surface
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/npm-pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'));
          if (!Array.isArray(data) || data.length !== 1 || !Array.isArray(data[0].files)) {
            throw new Error('PACKAGE_DRY_RUN_INVALID');
          }
          const files = new Set(data[0].files.map((entry) => entry.path));
          for (const required of ['dist/public.js', 'dist/public.d.ts', 'dist/automation/public.js', 'dist/automation/public.d.ts']) {
            if (!files.has(required)) throw new Error(`PACKAGE_EXPORT_MISSING:${required}`);
          }
          NODE

      - name: Repository invariant checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d vendor
          test ! -e .github/workflows/enterprise-runtime-refactor-once.yml
          test ! -e .github/workflows/enterprise-dead-code-audit-once.yml
          test ! -e .github/workflows/enterprise-examples-refactor-once.yml
          test ! -e .github/workflows/enterprise-convergence-once.yml
          test ! -e .github/workflows/enterprise-finish-once.yml
          test ! -e scripts/enterprise-convergence-edit.mjs
          test ! -e scripts/enterprise-finish-edit.mjs
