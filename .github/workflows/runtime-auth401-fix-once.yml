name: Runtime Unauthorized Refresh Fix Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Patch broker 401 background refresh
        run: |
          set -euo pipefail
          python3 scripts/runtime-auth401-fix.py
          rm scripts/runtime-auth401-fix.py

      - name: Validate unauthorized refresh containment
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'UnauthorizedRefreshCoordinator' src/automation/runtimeOrchestrator.ts
          grep -q 'auth.background-refresh-failed' src/automation/runtimeOrchestrator.ts
          if grep -q 'void tokens.get(true)' src/automation/runtimeOrchestrator.ts; then
            echo 'unhandled background token refresh remains' >&2
            exit 1
          fi

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git add -A
          git status --short
          git commit -m 'fix: contain broker 401 background token refresh'
          git push origin HEAD:refactor/enterprise-convergence-20260817
