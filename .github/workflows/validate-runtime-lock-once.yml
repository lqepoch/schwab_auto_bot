name: Validate Runtime Lock Once

on:
  push:
    branches:
      - refactor/enterprise-convergence-20260817

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate runtime lock arbitration
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npx --yes knip@6.31.0 --include files,dependencies,unlisted,unresolved --reporter compact
          git diff --check
          grep -q 'RUNTIME_LOCK_RECLAIM_IN_PROGRESS' src/automation/state/runtimeLock.ts
          grep -q 'const current = readLock(path);' src/automation/state/runtimeLock.ts
          grep -q 'typeof value.ownerId !== "string"' src/automation/state/runtimeLock.ts
          grep -q 'existing reclaim gate blocks takeover' test/runtime_lock.test.ts
          grep -q 'ownerless' test/runtime_lock.test.ts

      - name: Remove validation workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LQ'
          git config user.email 'lqepoch@126.com'
          git rm .github/workflows/validate-runtime-lock-once.yml
          git commit -m 'chore: remove runtime lock validation workflow'
          git push origin HEAD:refactor/enterprise-convergence-20260817
