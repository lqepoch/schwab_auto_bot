name: Apply Runtime Order Authority Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-order-authority-once.yml'
      - 'scripts/patch-runtime-order-authority.py'
      - 'src/automation/broker/runtimeOrderAuthority.ts'
      - 'src/automation/runtimeOrchestrator.ts'
      - 'test/runtime_order_authority.test.ts'
      - 'test/runtime_order_authority_wiring.test.ts'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/runtime-order-authority-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/runtime-order-authority-20260818
          fetch-depth: 0

      - name: Detect pending patch
        id: pending
        shell: bash
        run: |
          if test -f scripts/patch-runtime-order-authority.py; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 24
        if: steps.pending.outputs.apply == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        if: steps.pending.outputs.apply == 'true'
        run: npm ci --ignore-scripts

      - name: Apply runtime order-authority integration
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-runtime-order-authority.py
          rm scripts/patch-runtime-order-authority.py

      - name: Typecheck integrated runtime
        if: steps.pending.outputs.apply == 'true'
        run: npm run typecheck

      - name: Run focused order-authority tests
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --experimental-strip-types --test test/runtime_order_authority.test.ts test/runtime_order_authority_wiring.test.ts

      - name: Run complete test suite
        if: steps.pending.outputs.apply == 'true'
        run: npm test

      - name: Detect dead code and dependency drift
        if: steps.pending.outputs.apply == 'true'
        run: npm run lint:deadcode

      - name: Validate PowerShell hot-switch identity
        if: steps.pending.outputs.apply == 'true'
        shell: pwsh
        run: ./test/hot_switch_identity.test.ps1

      - name: Gate runtime benchmark medians
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/runtime-benchmark
          for run in 1 2 3; do
            npm run benchmark:runtime -- --output ".artifacts/runtime-benchmark/run-${run}.json" >/dev/null
          done
          npm run benchmark:runtime:check -- --baseline bench/runtime-baseline.json --current-dir .artifacts/runtime-benchmark --min-samples 3
          rm -rf .artifacts/runtime-benchmark

      - name: Verify integration invariants
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'const orderAuthority = new RuntimeOrderAuthority' src/automation/runtimeOrchestrator.ts
          ! grep -q 'let orderAuthorityRevision = 0' src/automation/runtimeOrchestrator.ts
          ! grep -q 'const ordersById = new OrderLookup' src/automation/runtimeOrchestrator.ts
          ! grep -q 'const runtimeOrderIndex = new RuntimeOrderIndexCache' src/automation/runtimeOrchestrator.ts
          ! grep -q 'const orderMetadata = new RuntimeOrderMetadataCache' src/automation/runtimeOrchestrator.ts

      - name: Commit validated product changes
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-runtime-order-authority-once.yml
          git commit -m 'refactor: centralize runtime order authority'
          git push origin HEAD:refactor/runtime-order-authority-20260818
